<!DOCTYPE html>
<head>
  <title>Chatbot</title>
  <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
  <script>
    // Enable pusher logging - don't include this in production
    Pusher.logToConsole = true;
    const BACKEND_URL = "https://back-usro.onrender.com"; // <-- tu backend
    const PUSHER_CONFIG = {
      A: {
        key: "5398827de005ac67b6b2",
        channel: "josue-juanito",
        cluster: "us2",
      },
      B: {
        key: "08f9ca3827443d276de3",
        channel: "josue-yeremi",
        cluster: "mt1",
      },
    };

    // Estado global
    let currentUser = "A";
    let currentKey = PUSHER_CONFIG.A.key;
    let currentChannel = PUSHER_CONFIG.A.channel;
    let currentCluster = PUSHER_CONFIG.A.cluster;

    // ID para distinguir mensajes propios y evitar duplicados
    const senderId = Math.random().toString(36).substring(2, 15);

    let pusherClient = null;
    let currentPusherChannel = null;

    function initPusher(key, channelName, cluster) {
      // Desconectar Pusher anterior si existe
      if (pusherClient) {
        try {
          if (currentPusherChannel && currentPusherChannel.name) {
            pusherClient.unsubscribe(currentPusherChannel.name);
          } else if (currentPusherChannel) {
            // fallback: intentar con channelName
            pusherClient.unsubscribe(channelName);
          }
        } catch (e) {
          console.warn("Error unsubscribing:", e);
        }
        try {
          pusherClient.disconnect();
        } catch (e) {
          console.warn("Error disconnecting:", e);
        }
      }

      // Inicializar nuevo Pusher con la cluster adecuada
      pusherClient = new Pusher(key, { cluster: cluster });
      currentPusherChannel = pusherClient.subscribe(channelName);

      // Configurar el listener de mensajes
      currentPusherChannel.bind("my-event", function (data) {
        // data puede ser string u objeto; manejar ambos casos
        let payload;
        if (typeof data === "string") {
          try {
            payload = JSON.parse(data);
          } catch {
            payload = { text: data };
          }
        } else {
          payload = data;
        }

        // Si es mensaje enviado por mi mismo (reenviado por backend), ignorar (ya lo mostramos localmente)
        if (payload && payload.senderId && payload.senderId === senderId) {
          return;
        }

        const chatBox = document.getElementById("chatBox");
        const messageElement = document.createElement("div");
        messageElement.style.marginBottom = "10px";
        messageElement.style.padding = "8px";
        messageElement.style.backgroundColor = "#6daed4";
        messageElement.style.borderRadius = "8px";
        messageElement.style.color = "white";
        messageElement.style.width = "fit-content";
        messageElement.textContent =
          payload.message ?? payload.text ?? JSON.stringify(payload);
        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight;

        // Actualizar la tabla de mensajes
        loadMessages();
      });
    }

    // Función para cambiar de usuario
    function switchUser(userKey, activeButton) {
      const cfg = PUSHER_CONFIG[userKey];
      if (!cfg) return;

      // Limpiar chat visible
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      // Reiniciar Pusher con nueva configuración
      initPusher(cfg.key, cfg.channel, cfg.cluster);

      // Actualizar UI
      const currentKeyLabel = document.getElementById("currentKeyLabel");
      const btnA = document.getElementById("btnUserA");
      const btnB = document.getElementById("btnUserB");

      currentKeyLabel.textContent = `Key: ${cfg.key.slice(
        0,
        3
      )}... | Channel: ${cfg.channel}`;
      btnA.classList.remove("active");
      btnB.classList.remove("active");
      activeButton.classList.add("active");

      // Actualizar variables globales
      currentUser = userKey;
      currentKey = cfg.key;
      currentChannel = cfg.channel;
      currentCluster = cfg.cluster;

      // Recargar historial (desde tu backend)
      loadMessages();
    }

    // Inicializar con valores por defecto
    document.addEventListener("DOMContentLoaded", function () {
      initPusher(currentKey, currentChannel, currentCluster);

      document
        .getElementById("btnUserA")
        .addEventListener("click", () =>
          switchUser("A", document.getElementById("btnUserA"))
        );

      document
        .getElementById("btnUserB")
        .addEventListener("click", () =>
          switchUser("B", document.getElementById("btnUserB"))
        );

      // Iniciar carga de mensajes
      loadMessages();
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .user-switch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 120px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.05);
    }
    .user-switch button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #bbb;
      background: #f7f7f7;
      cursor: pointer;
    }
    .user-switch button.active {
      background: #6daed4;
      color: white;
      border-color: #5a9cc0;
    }

    .chat-container {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 18px;
      width: 300px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .message {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 8px;
      color: white;
      width: fit-content;
    }

    .message-sent {
      background-color: #695c5b;
      margin-left: auto;
    }

    .message-received {
      background-color: #6daed4;
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: 500px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      padding: 10px;
      overflow-y: auto;
      background-color: #fafafa;
    }

    .input-box {
      width: 100%;
    }

    .input-box input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .container {
      display: flex;
      gap: 20px;
    }

    .messages-table {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 18px;
      width: 400px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f2f2f2;
    }

    .messages-table {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 18px;
      width: 400px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      /* Añadir estas propiedades */
      max-height: 500px;
      display: flex;
      flex-direction: column;
    }

    /* Añadir estos estilos nuevos */
    .table-container {
      overflow-y: auto;
      max-height: calc(100% - 40px); /* 40px para el título h3 */
      scrollbar-width: thin;
      scrollbar-color: #6daed4 #f1f1f1;
    }

    /* Estilos para scrollbar en Chrome/Safari */
    .table-container::-webkit-scrollbar {
      width: 8px;
    }

    .table-container::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }

    .table-container::-webkit-scrollbar-thumb {
      background: #6daed4;
      border-radius: 4px;
    }

    .table-container::-webkit-scrollbar-thumb:hover {
      background: #5a9cc0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <!-- Mensajes aparecerán aquí -->
      </div>
      <div class="input-box">
        <p></p>
        <input
          type="text"
          id="chatInput"
          placeholder="Escribe un mensaje..."
          data-bs-toggle=""
          data-bs-target=""
        />
      </div>
    </div>
    <!-- Caja con botones para alternar entre usuarios/keys -->
    <div class="user-switch" id="userSwitch">
      <button id="btnUserA">JUAN</button>
      <button id="btnUserB">JOSUE</button>
      <div id="currentKeyLabel" style="font-size: 12px; color: #666">
        Elige un usuario
      </div>
    </div>
    <div class="messages-table">
      <h3>Historial de Mensajes</h3>
      <button
        id="btnRefresh"
        style="
          padding: 6px 10px;
          border-radius: 6px;
          border: 1px solid #6daed4;
          background: #fff;
          color: #333;
          cursor: pointer;
        "
      >
        Actualizar
      </button>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Mensaje</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="messagesList">
            <!-- Los mensajes se cargarán aquí -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    const input = document.getElementById("chatInput");

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        const text = input.value.trim();
        if (text === "") return;

        // Mostrar mensaje en la chatBox localmente (propio)
        const chatBox = document.getElementById("chatBox");
        const messageElement = document.createElement("div");
        messageElement.style.marginBottom = "10px";
        messageElement.style.padding = "8px";
        messageElement.style.backgroundColor = "#695c5b";
        messageElement.style.borderRadius = "8px";
        messageElement.style.color = "white";
        messageElement.style.width = "fit-content";
        messageElement.style.marginLeft = "auto";
        messageElement.textContent = text;
        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight;

        // Enviar mensaje a TU backend (siempre)
        fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text, // Simplifica el formato
            senderId: senderId,
            channel: currentChannel,
          }),
        })
          .then((res) => res.json().catch(() => ({})))
          .then((data) => {
            console.log("Enviado:", data);
          })
          .catch((err) => {
            console.error("Error al enviar:", err);
          });

        input.value = "";
      }
    });

    async function loadMessages() {
      const tbody = document.getElementById("messagesList");
      try {
        tbody.innerHTML = '<tr><td colspan="2">Cargando mensajes...</td></tr>';

        const response = await fetch(`${BACKEND_URL}/messages`);
        if (!response.ok) throw new Error("Error al cargar mensajes");

        const messages = await response.json();
        tbody.innerHTML = "";

        if (!Array.isArray(messages) || messages.length === 0) {
          tbody.innerHTML = '<tr><td colspan="2">No hay mensajes</td></tr>';
          return;
        }

        messages.forEach((msg) => {
          const row = document.createElement("tr");
          row.innerHTML = `
                  <td>${
                    msg.mensaje ? msg.mensaje.replace(/</g, "&lt;") : ""
                  }</td>
                  <td>${msg.fecha_publicacion ? msg.fecha_publicacion : ""}</td>
              `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error("Error cargando mensajes:", error);
        tbody.innerHTML =
          '<tr><td colspan="2">Error al cargar mensajes</td></tr>';
      }
    }

    // Cargar mensajes al inicio
    loadMessages();

    const btnRefresh = document.getElementById("btnRefresh");
    if (btnRefresh) {
      btnRefresh.addEventListener("click", function () {
        const btn = this;
        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = "Cargando...";
        loadMessages().finally(() => {
          btn.disabled = false;
          btn.textContent = original;
        });
      });
    }

    // Recargar mensajes cuando se recibe uno nuevo
    if (currentPusherChannel) {
      currentPusherChannel.bind("my-event", function (data) {
        loadMessages();
      });
    }
    pusher.connection.bind("connected", () => {
      console.log("Conectado a Pusher con:", {
        key: currentKey || pusher.key,
        cluster: currentCluster || pusher.config.cluster,
        channel: currentChannel || channel.name,
      });
    });

    channel.bind("subscription_succeeded", () => {
      console.log("Suscrito al canal:", currentChannel || channel.name);
    });

    if (pusherClient && pusherClient.connection) {
      pusherClient.connection.bind("connected", () => {
        console.log("Conectado a Pusher con:", {
          key: currentKey,
          cluster: currentCluster,
          channel: currentChannel,
        });
      });
    }

    if (currentPusherChannel) {
      currentPusherChannel.bind("pusher:subscription_succeeded", () => {
        console.log("Suscrito al canal:", currentChannel);
      });

      currentPusherChannel.bind("my-event", function (data) {
        loadMessages();
      });
    }
  </script>
</body>
